<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artifact Iframe Renderer — 测试页</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .header .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #0ea5e9;
      color: #fff;
    }

    .preset-select {
      margin-left: auto;
      padding: 5px 10px;
      font-size: 12px;
      background: #334155;
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
    }

    .run-btn {
      padding: 6px 18px;
      font-size: 13px;
      font-weight: 600;
      background: #0ea5e9;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .run-btn:hover {
      background: #0284c7;
    }

    /* ── panels ── */
    .panels {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .editor-panel {
      width: 46%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
    }

    .editor-label {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }

    #code {
      flex: 1;
      width: 100%;
      padding: 14px;
      resize: none;
      outline: none;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      border: none;
      tab-size: 2;
    }

    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .preview-label {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #status {
      font-size: 11px;
      margin-left: auto;
    }

    #status.ok {
      color: #22c55e;
    }

    #status.err {
      color: #ef4444;
    }

    #status.busy {
      color: #f59e0b;
    }

    #preview {
      flex: 1;
      border: none;
      background: #fff;
    }
  </style>
</head>

<body>
  <div class="layout">

    <!-- header -->
    <div class="header">
      <h1>Artifact Iframe Renderer</h1>
      <span class="badge">测试页</span>
      <select class="preset-select" id="presetSelect">
        <option value="">── 选择预设 ──</option>
        <option value="counter">计数器（useState）</option>
        <option value="barChart">柱状图（recharts）</option>
        <option value="lineChart">折线图（recharts）</option>
        <option value="pieChart">饼图（recharts）</option>
        <option value="icons">图标（lucide-react）</option>
        <option value="card">卡片（shadcn/ui）</option>
        <option value="tabs">标签页（shadcn/ui）</option>
        <option value="table">表格（shadcn/ui）</option>
        <option value="dashboard">综合仪表盘</option>
      </select>
      <button class="run-btn" id="runBtn">▶ 运行</button>
    </div>

    <!-- panels -->
    <div class="panels">

      <!-- editor -->
      <div class="editor-panel">
        <div class="editor-label">App.tsx</div>
        <textarea id="code" spellcheck="false"></textarea>
      </div>

      <!-- preview -->
      <div class="preview-panel">
        <div class="preview-label">
          预览
          <span id="status" class="ok">就绪</span>
        </div>
        <iframe id="preview" sandbox="allow-scripts"></iframe>
      </div>

    </div>
  </div>

    // ─── Preset examples ────────────────────────────────────────────────────────

    const PRESETS = {

            <Minus className="h-4 w-4" />

          <Button variant="outline" size="icon" onClick={() => setCount(c => c + 1)}>

      dashboard: `import { useState } from "react";

    };

    // ─── Build the same iframe HTML as IframeRenderer.tsx ────────────────────────

    function safeJsonStr(s) {
      return JSON.stringify(s).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
    }

    function buildIframeHTML(code, title) {
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</title>
  <script src="/artifact-deps/tailwind.cdn.js"><\/script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/artifact-deps/react.production.min.js"><\/script>
  <script src="/artifact-deps/react-dom.production.min.js"><\/script>
  <script src="/artifact-deps/prop-types.min.js"><\/script>
  <script src="/artifact-deps/babel.min.js"><\/script>
  <script src="/artifact-deps/recharts.min.js"><\/script>
  <script src="/artifact-deps/lucide-react.min.js"><\/script>
  <script src="/artifact-deps/artifact-runtime.js"><\/script>
  <script>
    (function () {
      var userCode = ${safeJsonStr(code)};
      try {
        var transformed = Babel.transform(userCode, {
          filename: 'App.tsx',
          presets: [
            ['react', { runtime: 'classic' }],
            ['typescript', { allExtensions: true, isTSX: true }],
          ],
          plugins: ['transform-modules-commonjs'],
        }).code;

        var preamble = 'var React = require("react"); var ReactDOM = require("react-dom");\\n';
        var mod = { exports: {} };
        new Function('require', 'module', 'exports', preamble + transformed)(
          window.__artifactRequire, mod, mod.exports
        );

        var Component = mod.exports['default'] || mod.exports;
        if (typeof Component !== 'function') {
          throw new Error('No default export found. Use "export default function ComponentName() { ... }"');
        }
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Component));
      } catch (e) {
        document.getElementById('root').innerHTML =
          '<div style="color:#dc2626;padding:20px;font-family:monospace;font-size:13px;' +
          'white-space:pre-wrap;background:#fef2f2;border-left:4px solid #dc2626;' +
          'margin:16px;border-radius:4px"><b>Render Error</b>\\n\\n' +
          String((e && e.message) || e) + '<\\/div>';
      }
    })();
  <\/script>
</body>
</html>`;
    }

    // ─── Wire up UI ───────────────────────────────────────────────────────────────

    const codeEl = document.getElementById('code');
    const previewEl = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const runBtn = document.getElementById('runBtn');
    const presetSel = document.getElementById('presetSelect');

    function run() {
      const code = codeEl.value.trim();
      if (!code) return;
      statusEl.textContent = '渲染中…';
      statusEl.className = 'busy';

      previewEl.srcdoc = buildIframeHTML(code, 'Artifact Test');

      // Listen for load (success proxy — errors are inside the iframe)
      previewEl.onload = function () {
        statusEl.textContent = '完成';
        statusEl.className = 'ok';
      };
    }

    runBtn.addEventListener('click', run);

    codeEl.addEventListener('keydown', function (e) {
      // Ctrl/Cmd + Enter to run
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
      // Tab → indent
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = codeEl.selectionStart, end = codeEl.selectionEnd;
        codeEl.value = codeEl.value.slice(0, s) + '  ' + codeEl.value.slice(end);
        codeEl.selectionStart = codeEl.selectionEnd = s + 2;
      }
    });

    presetSel.addEventListener('change', function () {
      const key = presetSel.value;
      if (key && PRESETS[key]) {
        codeEl.value = PRESETS[key];
        run();
      }
    });

    // Load default preset on open
    codeEl.value = PRESETS.counter;
    run();
  </script>
</body>

</html>
